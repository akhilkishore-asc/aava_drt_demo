openapi: 3.0.3
info:
  title: DRT Platform API
  version: 1.0.0
  description: API for the DRT Platform
servers:
  - url: https://{host}/api/v1
    variables:
      host:
        default: api.drt.kpmg.com
        description: API host

security:
  - EntraOAuth2:
      - "api://drt-backend-api/user_impersonation"

paths:
  /core-asks:
    post:
      operationId: createCoreAsk
      summary: Create a new Core ASK and either save it as a draft or submit it for review, based on buttonValue. Exit makes no change.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
          description: Idempotency key to ensure safe retries
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCoreAskRequest'
      responses:
        '201':
          description: Created - ASK saved or submitted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateCoreAskResponse'
        '200':
          description: OK - Exit button, no changes made
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateCoreAskResponse'
        '400':
          description: Validation failed - missing required field, inactive reference ID, date rule broken, or fteAmount above headCountAmount
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Access denied - no create permission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: Conflict - duplicate Idempotency-Key with a different body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '503':
          description: Dependency unavailable - reference, employee or attachment service down
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

components:
  securitySchemes:
    EntraOAuth2:
      type: oauth2
      description: >-
        Microsoft Entra ID, OAuth 2.0 Authorization Code Flow with PKCE.
        The API validates issuer, tenant, audience, signature and lifetime.
      flows:
        authorizationCode:
          authorizationUrl: "https://login.microsoftonline.com/TENANT_ID/oauth2/v2.0/authorize"
          tokenUrl: "https://login.microsoftonline.com/TENANT_ID/oauth2/v2.0/token"
          scopes:
            "api://drt-backend-api/user_impersonation": "Access DRT on behalf of the signed-in user"

  schemas:
    CreateCoreAskRequest:
      type: object
      required:
        - coreAskDetails
        - buttonValue
      properties:
        coreAskDetails:
          $ref: '#/components/schemas/CoreAskDetails'
        comment:
          type: string
        documents:
          type: array
          items:
            $ref: '#/components/schemas/DocumentReference'
        buttonValue:
          type: string
          enum:
            - "Save & Exit"
            - "SUBMIT"
            - "Exit"

    CreateCoreAskResponse:
      type: object
      required:
        - askId
        - askDetailId
        - coreAskDetails
        - version
        - auditHistory
      properties:
        askId:
          type: string
          format: uuid
        askDetailId:
          type: string
          format: uuid
        coreAskDetails:
          $ref: '#/components/schemas/CoreAskDetails'
        version:
          type: integer
          format: int32
          description: Set to 1 for new ASK
        task:
          $ref: '#/components/schemas/TaskReference'
        comment:
          $ref: '#/components/schemas/CommentReference'
        auditHistory:
          $ref: '#/components/schemas/AuditReference'

    CoreAskDetails:
      type: object
      required:
        - coreAskName
        - dppGroupId
        - needReasonId
        - generalSpecialityNeedId
        - levelNeedId
        - projectedStartDate
        - headCountAmount
        - fteAmount
        - titlingCategory
        - roleSummary
        - roleResponsibility
        - roleQualification
      properties:
        coreAskName:
          type: string
          maxLength: 200
        dppGroupId:
          type: integer
          format: int32
          description: Must be an active option
        needReasonId:
          type: integer
          format: int32
        generalSpecialityNeedId:
          type: integer
          format: int32
        generalSpecialityNeedComment:
          type: string
          description: Required unless generalSpecialityNeedId is the first option
        levelNeedId:
          type: integer
          format: int32
        pml:
          type: string
          maxLength: 99
        projectedStartDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
          description: Required unless needReasonId is retirement. Must be after projectedStartDate and not before today
        outgoingResource:
          type: string
          description: Derived from employeeId, read-only
        employeeId:
          type: integer
          format: int32
        headCountAmount:
          type: integer
          format: int32
        fteAmount:
          type: number
          format: double
          description: Must not exceed headCountAmount
        rolePostingId:
          type: integer
          format: int32
          description: Required only when levelNeedId is in the top-3 set
        numberofresources:
          type: integer
          format: int32
        titlingCategory:
          type: string
        transitionalCoach:
          type: string
          maxLength: 99
        roleSummary:
          type: string
        roleResponsibility:
          type: string
        roleQualification:
          type: string

    DocumentReference:
      type: object
      required:
        - documentId
        - name
      properties:
        documentId:
          type: string
          format: uuid
        name:
          type: string

    TaskReference:
      type: object
      required:
        - taskId
        - statusId
      properties:
        taskId:
          type: string
          format: uuid
        statusId:
          type: integer
          format: int32
          description: 123 In Progress, 127 PPL Review, or 145 DPP Ops Review
        assigneeId:
          type: string
          format: uuid

    CommentReference:
      type: object
      required:
        - commentId
      properties:
        commentId:
          type: string
          format: uuid

    AuditReference:
      type: object
      required:
        - auditId
      properties:
        auditId:
          type: string
          format: uuid

    ProblemDetails:
      type: object
      description: RFC 7807 problem response, as emitted by ASP.NET Core.
      required:
        - type
        - title
        - status
        - traceId
      properties:
        type:
          type: string
          format: uri
          description: URI identifying the problem type.
          example: "https://drt.kpmg.com/errors/validation-failed"
        title:
          type: string
          description: Short, human-readable summary. Stable for a given type.
          example: "One or more validation errors occurred."
        status:
          type: integer
          format: int32
          example: 400
        detail:
          type: string
          description: Explanation specific to this occurrence.
          example: "endDate must be later than projectedStartDate."
        instance:
          type: string
          description: The request path this occurred on.
          example: "/api/v1/core-asks"
        code:
          type: string
          description: Stable DRT error code. Safe for clients to branch on.
          example: "DRT-CORE-ASK-0012"
        traceId:
          type: string
          description: W3C trace identifier for the request.
          example: "00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-01"
        errors:
          type: object
          description: >-
            Field-level validation failures. Present on 400 and 422 only.
            Each key is the field name; each value is the list of messages for it.
          additionalProperties:
            type: array
            items:
              type: string
          example:
            fteAmount:
              - "fteAmount must not exceed headCountAmount."
            endDate:
              - "endDate must not be earlier than today."
